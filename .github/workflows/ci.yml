name: CI
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test --workspaces --if-present
      - name: Integration DB tests (containers)
        env:
          RUN_DB_TESTS: '1'
        run: npm run test:db:all
      - name: Size budgets
        run: npm run size:bundle
      - name: Enforce bundle size thresholds
        run: node size-tests/check-thresholds.mjs

