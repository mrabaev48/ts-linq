name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check · Lint · Unit · Integration · Build · Arch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm version is taken from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Key the Turbo cache by a hash of the whole source tree (not the commit
      # SHA with a broad prefix fallback). The packages use composite/incremental
      # `tsc`, whose `.tsbuildinfo` state is not hermetic across the cache: a
      # `restore-keys: turbo-<os>-` fallback restores an older commit's cached
      # `dist/**` onto a changed tree, and incremental `tsc` then skips re-emitting
      # declarations — producing an incomplete `dist` (e.g. `@ts-linq/types`
      # missing exports) and breaking downstream builds. Restoring a cache only
      # when the entire source tree is identical guarantees the cached outputs
      # match the inputs; any source change falls through to a clean build.
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'packages/**/src/**/*.ts', 'packages/**/tsconfig*.json', 'packages/**/package.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first so that every package's dist/ and .d.ts files exist
      # before typecheck and tests try to resolve cross-package imports.
      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm typecheck

      - name: Type tests (tsd)
        run: pnpm test-d

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Architecture — dependency rules
        run: pnpm arch:deps

      - name: Architecture — circular dependencies
        run: pnpm arch:cycles

      - name: Architecture — phantom dependencies
        run: pnpm arch:phantom

  version-bump-check:
    name: Version bump present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version bumped for changed packages
        run: |
          # Packages excluded from versioning (mirrors .changeset/config.json ignore list)
          EXCLUDED="e2e-tests|integration-tests|examples|eslint-config|jest-config|typescript-config"

          # Find versioned packages whose src/ changed in this PR
          CHANGED=$(git diff origin/${{ github.base_ref }}...HEAD --name-only \
            | grep -E '^packages/[^/]+/src/' \
            | grep -vE "^packages/(${EXCLUDED})/" \
            | sed 's|packages/\([^/]*\)/.*|\1|' \
            | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "No versioned package sources changed — no version bump required."
            exit 0
          fi

          echo "Changed versioned packages: $(echo "$CHANGED" | tr '\n' ' ')"

          # Verify at least one package.json version was bumped
          BUMPS=$(git diff origin/${{ github.base_ref }}...HEAD -- packages/*/package.json \
            | grep '^\+.*"version"' | wc -l)

          if [ "$BUMPS" -eq 0 ]; then
            echo ""
            echo "ERROR: Source files changed in versioned packages but no package.json versions were bumped."
            echo "Run 'pnpm changeset && pnpm changeset version' before pushing."
            exit 1
          fi

          echo "Version bump detected (${BUMPS} package(s)) — OK."

      - name: Verify no unconsumed changeset files remain
        run: |
          COUNT=$(find .changeset -name "*.md" ! -name "README.md" | wc -l | tr -d ' ')
          if [ "$COUNT" -gt 0 ]; then
            echo "ERROR: Found ${COUNT} unconsumed changeset file(s)."
            echo "Run 'pnpm changeset version' to consume them before opening the PR."
            find .changeset -name "*.md" ! -name "README.md"
            exit 1
          fi
          echo "No unconsumed changesets — OK."
